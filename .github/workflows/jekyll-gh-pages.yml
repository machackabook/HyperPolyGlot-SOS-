name: Deploy HyperPolyGlot OS to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Compile TypeScript
        run: bun run lint
      - name: Build Vite for GitHub Pages
        run: bun run build
        env:
          GITHUB_PAGES: 'true'
      - name: Validate compiled assets
        run: |
          test -f dist/index.html
          test -d dist/assets
          grep -q '/HyperPolyGlot-SOS-/assets/' dist/index.html
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
