name: GAIA conversational core

on:
  push:
    branches: [main, "feature/**"]
    paths:
      - "src/services/gaiaPersona.mjs"
      - "tests/gaia-persona.test.mjs"
      - ".github/workflows/gaia-conversation.yml"
  pull_request:
    paths:
      - "src/services/gaiaPersona.mjs"
      - "tests/gaia-persona.test.mjs"
      - ".github/workflows/gaia-conversation.yml"

permissions:
  contents: read

jobs:
  persona-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify conversational identity contract
        run: node --test tests/gaia-persona.test.mjs
