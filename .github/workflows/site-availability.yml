name: Public Site Availability — Cryptic + HyperTerminal
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: read
jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check GitHub Pages application rendering
        run: node tools/browser-smoke.mjs https://machackabook.github.io/HyperPolyGlot-SOS-/
      - name: Check canonical domain and deployed release health
        if: always()
        run: |
          curl --fail --silent --show-error --location --max-time 30 https://crypticnews.org/healthz | tee /tmp/cryptic-health.json
          node --input-type=module -e "import fs from 'node:fs'; const h=JSON.parse(fs.readFileSync('/tmp/cryptic-health.json')); if(h.ok!==true) process.exit(1)"
          curl --fail --silent --show-error --location --max-time 30 https://www.crypticnews.org/ > /dev/null
