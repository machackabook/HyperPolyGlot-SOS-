name: Public Site Availability — Cryptic + HyperTerminal
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/**'
      - 'public/**'
      - 'vite.config.ts'
      - 'wrangler.jsonc'
      - '.github/workflows/site-availability.yml'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  http-checks:
    name: HTTPS ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Cryptic-apex
            url: https://crypticnews.org/
          - label: Cryptic-www
            url: https://www.crypticnews.org/
          - label: GitHub-Pages
            url: https://machackabook.github.io/HyperPolyGlot-SOS-/
          - label: React-module
            url: https://esm.sh/gh/machackabook/HyperPolyGlot-SOS-@main/src/App.tsx?deps=react@19.0.1,three@0.186.1&external=react
    steps:
      - name: Measure public HTTPS response
        env:
          SITE_URL: ${{ matrix.url }}
          SITE_LABEL: ${{ matrix.label }}
        shell: bash
        run: |
          set -euo pipefail
          output="$(mktemp)"
          code="$(curl --silent --show-error --location --max-time 40 \
            --retry 2 --retry-delay 1 -o "${output}" -w '%{http_code}' "${SITE_URL}")" || code=000
          bytes="$(wc -c < "${output}")"
          echo "site=${SITE_LABEL}"
          echo "http_status=${code}"
          echo "response_bytes=${bytes}"
          echo "site=${SITE_LABEL}" >> "${GITHUB_STEP_SUMMARY}"
          echo "http_status=${code}" >> "${GITHUB_STEP_SUMMARY}"
          echo "response_bytes=${bytes}" >> "${GITHUB_STEP_SUMMARY}"
          if [[ "${code}" != 2?? ]] || [[ "${bytes}" -lt 300 ]]; then
            echo "::error title=${SITE_LABEL} unavailable::HTTP ${code} (${bytes} bytes)"
            exit 1
          fi
          echo "HTTPS response confirmed for ${SITE_LABEL}"
